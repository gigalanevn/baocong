<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Báo Công ChayThu</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
    <style>
        :root {
            --primary: #1a73e8;
            --shopee: #ee4d2d;
            --success: #34a853;
            --bg: #ffffff;
            --card-bg: #f8f9fa;
        }

        body, html { 
            height: 100%; margin: 0; padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background: var(--bg); overflow-x: hidden;
        }

        /* Quản lý ẩn hiện màn hình */
        .screen {
            display: none; /* Mặc định ẩn tất cả */
            width: 100%;
            min-height: 100vh;
            box-sizing: border-box;
        }

        .screen.active {
            display: flex; /* Chỉ hiện màn hình có class active */
            flex-direction: column;
        }

        /* MÀN HÌNH 1: TRANG CHỦ */
        #screen-home {
            justify-content: center;
            align-items: center;
            padding: 20px;
            background: linear-gradient(180deg, #ffffff 0%, #f1f3f4 100%);
        }

        .home-container {
            width: 100%;
            max-width: 400px;
            text-align: center;
        }

        .welcome-text {
            font-size: 24px;
            font-weight: 800;
            color: #3c4043;
            margin-bottom: 40px;
            letter-spacing: -0.5px;
        }

        .nav-card {
            display: flex;
            align-items: center;
            width: 100%;
            padding: 25px;
            margin-bottom: 20px;
            border-radius: 24px;
            text-decoration: none;
            color: white;
            font-weight: 700;
            font-size: 18px;
            border: none;
            cursor: pointer;
            box-shadow: 0 10px 20px rgba(0,0,0,0.1);
            transition: all 0.2s;
        }

        .nav-card:active { transform: scale(0.96); opacity: 0.9; }
        .btn-shopee { background: var(--shopee); }
        .btn-work { background: var(--primary); }
        .icon-circle {
            width: 50px; height: 50px; background: rgba(255,255,255,0.2);
            border-radius: 15px; display: flex; align-items: center;
            justify-content: center; font-size: 24px; margin-right: 20px;
        }

        /* MÀN HÌNH 2: BÁO CÔNG */
        #screen-work {
            padding: 15px;
            background: #f1f3f4;
        }

        .header {
            display: flex;
            align-items: center;
            padding: 10px 0 20px 0;
        }

        .btn-back {
            background: white; border: none; padding: 10px 15px;
            border-radius: 12px; font-weight: 700; color: var(--gray);
            box-shadow: 0 2px 5px rgba(0,0,0,0.05); margin-right: 15px;
        }

        .card { 
            background: white; padding: 20px; border-radius: 20px; 
            box-shadow: 0 4px 15px rgba(0,0,0,0.05); margin-bottom: 20px;
        }

        .form-group { margin-bottom: 15px; }
        label { display: block; margin-bottom: 8px; font-weight: 700; font-size: 13px; color: #5f6368; }
        input, select { 
            width: 100%; padding: 14px; border: 1.5px solid #eee; 
            border-radius: 12px; font-size: 16px; background: #f8f9fa;
            box-sizing: border-box; outline: none;
        }

        .time-row { display: flex; gap: 10px; align-items: center; }
        .time-box { flex: 1; background: #f1f3f4; border-radius: 12px; display: flex; align-items: center; padding: 0 10px; }
        .time-box select { background: transparent; border: none; padding: 12px 0; text-align: center; }

        #btnSend { 
            width: 100%; padding: 18px; background: var(--primary); color: white; 
            border: none; border-radius: 15px; font-size: 16px; font-weight: 800;
            box-shadow: 0 4px 10px rgba(26,115,232,0.3);
        }

        .history-section { margin-top: 10px; }
        .filter-bar { 
            display: flex; gap: 10px; margin-bottom: 15px; 
            align-items: center; justify-content: space-between;
        }

        .log-item { 
            background: white; padding: 16px; border-radius: 18px; 
            margin-bottom: 12px; border-left: 6px solid var(--success);
        }
    </style>
</head>
<body>

    <div id="screen-home" class="screen active">
        <div class="home-container">
            <div class="welcome-text">CHAYTHU CÔNG VIỆC</div>
            
            <a href="https://s.shopee.vn/6VHiHQX7nF" target="_blank" class="nav-card btn-shopee">
                <div class="icon-circle">🛍️</div>
                <span>MUA SẮM SHOPEE</span>
            </a>

            <button onclick="changeScreen('screen-work')" class="nav-card btn-work">
                <div class="icon-circle">📝</div>
                <span>VÀO BÁO CÔNG</span>
            </button>
        </div>
    </div>

    <div id="screen-work" class="screen">
        <div class="header">
            <button class="btn-back" onclick="changeScreen('screen-home')">← THOÁT</button>
            <h3 style="margin:0; color: var(--primary)">BÁO CÔNG</h3>
        </div>

        <div class="card">
            <div class="form-group">
                <label>HỌ VÀ TÊN</label>
                <input type="text" id="name" placeholder="Nhập họ tên..." oninput="handleNameInput(this)">
            </div>
            <div class="form-group">
                <label>GHI CHÚ</label>
                <input type="text" id="note" placeholder="Nội dung công việc..." oninput="localStorage.setItem('ct_note', this.value)">
            </div>
            <div class="form-group">
                <label>KHOẢNG THỜI GIAN</label>
                <div class="time-row">
                    <div class="time-box"><select id="sh"></select></div>
                    <span style="font-weight: bold">:</span>
                    <div class="time-box"><select id="sm"></select></div>
                    <span style="color:#999">➔</span>
                    <div class="time-box"><select id="eh"></select></div>
                    <span style="font-weight: bold">:</span>
                    <div class="time-box"><select id="em"></select></div>
                </div>
            </div>
            <input type="hidden" id="work_date">
            <button onclick="submitData()" id="btnSend">GỬI BÁO CÔNG</button>
        </div>

        <div class="history-section">
            <div class="filter-bar">
                <input type="text" id="filterName" style="flex:1; padding: 10px; border-radius: 10px; border:1px solid #ddd;" placeholder="Tìm tên..." oninput="filterLogs(this)">
                <button onclick="exportExcel()" style="background:white; border:1px solid var(--success); color:var(--success); padding:10px; border-radius:10px; font-weight:bold;">📊 EXCEL</button>
            </div>
            <div id="logs"></div>
        </div>
    </div>

<script>
    const SB_URL = "https://bcxaekeimoecixovogmm.supabase.co";
    const SB_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImJjeGFla2VpbW9lY2l4b3ZvZ21tIiwicm9sZSI6ImFub24iLCJpYXQiOjE3Njg5NzM2NDEsImV4cCI6MjA4NDU0OTY0MX0.lh1C9UUq7Cim1uSK49MOeVJbTKc7L0MOUp-EZM9iehA";
    const _sb = supabase.createClient(SB_URL, SB_KEY);
    let allLogs = [];

    // HÀM CHUYỂN MÀN HÌNH QUAN TRỌNG
    function changeScreen(screenId) {
        // Ẩn tất cả màn hình
        document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
        // Hiện màn hình được chọn
        const target = document.getElementById(screenId);
        target.classList.add('active');
        // Luôn cuộn lên đầu trang khi chuyển màn hình
        window.scrollTo(0, 0);
    }

    function formatName(str) { return str.toLowerCase().replace(/(^|\s)\S/g, l => l.toUpperCase()); }
    function handleNameInput(el) { el.value = formatName(el.value); localStorage.setItem('ct_user', el.value); }

    window.onload = () => {
        initTime();
        document.getElementById('work_date').value = new Date().toISOString().split('T')[0];
        document.getElementById('name').value = localStorage.getItem('ct_user') || '';
        document.getElementById('note').value = localStorage.getItem('ct_note') || '';
        loadLogs();
        _sb.channel('any').on('postgres_changes', { event: 'INSERT', schema: 'public', table: 'work_logs' }, () => loadLogs()).subscribe();
    };

    function initTime() {
        const fill = (id, max, def) => {
            const s = document.getElementById(id);
            for(let i=0; i<max; i++) {
                let v = i.toString().padStart(2, '0');
                s.add(new Option(v, v, i===def, i===def));
            }
        };
        fill('sh', 24, 8); fill('sm', 60, 0); fill('eh', 24, 20); fill('em', 60, 0);
    }

    async function loadLogs() {
        const { data } = await _sb.from('work_logs').select('*').order('id', { ascending: false }).limit(30);
        if(data) { allLogs = data; renderLogs(data); }
    }

    function renderLogs(data) {
        const container = document.getElementById('logs');
        container.innerHTML = '';
        data.forEach(log => {
            container.insertAdjacentHTML('beforeend', `
                <div class="log-item">
                    <div style="font-weight:800; color:var(--primary);">${log.name}</div>
                    <div style="font-size:14px; margin:5px 0; color:#444;">${log.note || ''}</div>
                    <div style="font-size:11px; color:#888; font-weight:bold;">📅 ${log.date.split('-').reverse().join('/')} | ⏱ ${log.time_range}</div>
                </div>`);
        });
    }

    function filterLogs(el) {
        const val = el.value.toLowerCase();
        renderLogs(allLogs.filter(l => l.name.toLowerCase().includes(val)));
    }

    async function submitData() {
        const btn = document.getElementById('btnSend');
        const name = document.getElementById('name').value.trim();
        if (!name) return alert("Vui lòng nhập tên!");
        btn.innerText = "ĐANG GỬI..."; btn.disabled = true;

        const timeRange = `${document.getElementById('sh').value}:${document.getElementById('sm').value} - ${document.getElementById('eh').value}:${document.getElementById('em').value}`;
        
        await _sb.from('work_logs').insert([{ 
            name: name, note: document.getElementById('note').value.trim(), 
            date: document.getElementById('work_date').value, 
            time_range: timeRange, created_at_time: new Date().toLocaleTimeString('vi-VN')
        }]);

        btn.innerText = "THÀNH CÔNG!";
        setTimeout(() => { btn.innerText = "GỬI BÁO CÔNG"; btn.disabled = false; }, 1000);
    }

    async function exportExcel() {
        const { data } = await _sb.from('work_logs').select('*').order('id', { ascending: true });
        const ws = XLSX.utils.json_to_sheet(data);
        const wb = XLSX.utils.book_new();
        XLSX.utils.book_append_sheet(wb, ws, "BaoCong");
        XLSX.writeFile(wb, "BaoCong.xlsx");
    }
</script>
</body>
</html>
